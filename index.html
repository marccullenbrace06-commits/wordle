<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Wordle Master - Final Stable Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --correct: #2ecc71;
            --present: #f1c40f;
            --absent: #3d3d3d;
            --primary: #00d2ff;
            --danger: #ff4757;
            --edit: #a29bfe;
            --solve: #95afc0;
            --gold: #ffd700;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            font-family: Arial, Helvetica, sans-serif;
            color: white; overflow: hidden;
            display: flex; flex-direction: column;
        }

        #welcome-screen { background: #1a1a1a url('firstbg.png') no-repeat center center/cover; position: relative; }
        #teacher-screen { background: #2c3e50 url('teachermodebg.png') no-repeat center center/cover; }
        #game-screen { background: #000 url('gamebg.png') no-repeat center center/cover; padding-top: 20px; } 
        #ranking-screen { background: #1a1a1a url('gamebg.png') no-repeat center center/cover; }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; }
        .active { display: flex !important; }

        .top-controls { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 100; }

        #game-header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; z-index: 50; }
        #puzzle-counter { background: var(--primary); color: #000; padding: 5px 20px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,210,255,0.4); }
        #lesson-title-display { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; opacity: 0.8; }

        .teacher-panel {
            width: 650px; max-height: 85vh; overflow-y: auto;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(25px);
            padding: 50px 30px; border-radius: 25px; border: 1px solid var(--glass-border);
            margin: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .teacher-panel::-webkit-scrollbar { width: 6px; }
        .teacher-panel::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .step-container { display: none; width: 100%; animation: slideIn 0.3s ease-out; }
        .step-container.active { display: flex; flex-direction: column; align-items: center; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .hub-btn {
            width: 100%; max-width: 450px; padding: 25px; margin-bottom: 15px;
            background: var(--glass); border: 1px solid var(--glass-border);
            color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 12px;
            transition: 0.2s;
        }
        .hub-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.02); }

        .load-row {
            display: flex; gap: 10px; width: 100%; max-width: 550px; margin-bottom: 12px;
            align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px;
        }
        .btn-play-lesson { flex: 3; background: var(--correct); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: left; }
        .btn-edit-lesson { flex: 1; background: var(--edit); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-del-lesson { flex: 0.8; background: var(--danger); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .form-section { width: 100%; max-width: 450px; text-align: left; margin-bottom: 30px; }
        .form-section label { display: block; font-size: 0.8rem; font-weight: bold; color: var(--primary); margin-bottom: 8px; letter-spacing: 1px; }
        input[type="text"], select, textarea { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 1rem; background: white; color: #333; box-sizing: border-box; }

        .word-card { width: 100%; max-width: 450px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid var(--primary); text-align: left; box-sizing: border-box; }

        .btn-action { padding: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 1rem; transition: 0.2s; }
        .btn-control { padding: 10px; width: 50px; background: var(--glass); border: 1px solid white; color: white; border-radius: 8px; cursor: pointer; }

        #scoreboard { position: fixed; top: 55%; left: 25px; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, 130px); gap: 25px; z-index: 10; }
        .team-box { padding: 15px 5px; text-align: center; color: #000; font-weight: bold; background: white; border-radius: 12px; width: 130px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 3px solid transparent; cursor: pointer; transition: 0.3s; }
        .team-box.active-team { border-color: var(--primary); box-shadow: 0 0 20px var(--primary); }
        .score-val { font-size: 1.5rem; display: block; margin: 3px 0; }
        .score-controls { display: flex; justify-content: center; gap: 5px; }
        .score-controls button { padding: 2px 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; border-radius: 4px; border: 1px solid #ccc; }
        
        .tile { width: 55px; height: 55px; border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; border-radius: 6px; background: rgba(0,0,0,0.7); transition: transform 0.3s, background 0.1s; }
        .tile.pop { transform: scale(1.1); border-color: #888; }
        .tile.flip-reveal { transform: scaleY(0); }

        .key { background: white; color: #000; border: none; border-radius: 5px; height: 55px; flex: 1; font-weight: bold; font-size: 1.5rem; cursor: pointer; }
        .correct { background: var(--correct) !important; color: white; }
        .present { background: var(--present) !important; color: white; }
        .absent { background: var(--absent) !important; color: white; }

        .rank-card { width: 400px; background: rgba(255,255,255,0.1); padding: 20px; margin: 10px; border-radius: 15px; display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; }
        .rank-1 { background: var(--gold); color: black; transform: scale(1.1); box-shadow: 0 0 30px var(--gold); }
    </style>
</head>
<body>
    <audio id="bgMusic" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg"></audio>

    <div id="welcome-screen" class="screen active">
        <div class="top-controls">
            <button class="btn-control" onclick="openTeacherHub()">⚙️</button>
            <button class="music-btn-node btn-control" onclick="toggleMusic()">🔇</button>
            <button class="btn-control" onclick="toggleFullScreen()">⛶</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:15px; width:300px; margin-top:250px; z-index: 1;">
            <button class="btn-action" style="background:#2ecc71; color:white;" onclick="startQuickGame()">START LESSON</button>
            <button class="btn-action" style="background:transparent; border:1px solid white; color:white;" onclick="openTeacherHub()">TEACHER SETTINGS</button>
        </div>
    </div>

    <div id="teacher-screen" class="screen">
        <div class="teacher-panel">
            <div id="hub-view" class="step-container active">
                <h2 style="margin-bottom:40px;">TEACHER HUB</h2>
                <button class="hub-btn" onclick="startFreshCreate()">CREATE NEW LESSON PLAN</button>
                <button class="hub-btn" onclick="openLoadStep()">LOAD SAVED LESSON PLAN</button>
                <div style="display:flex; gap:10px; width:100%; max-width:450px;">
                    <button class="hub-btn" style="font-size:0.8rem; padding:10px;" onclick="exportAllLessons()">EXPORT BACKUP (.JSON)</button>
                    <button class="hub-btn" style="font-size:0.8rem; padding:10px;" onclick="document.getElementById('importFile').click()">IMPORT BACKUP</button>
                </div>
                <input type="file" id="importFile" hidden accept=".json" onchange="importLessons(event)">
                <button class="btn-action" onclick="showScreen('welcome-screen')" style="margin-top:20px; background:none; color:white; border:1px solid white;">EXIT TO MAIN MENU</button>
            </div>
            
            <div id="create-step" class="step-container">
                <button class="btn-action" onclick="goToStep('hub-view')" style="background:none; color:white; margin-bottom:10px;">← BACK TO HUB</button>
                <h2 id="create-title" style="margin-bottom:30px;">NEW LESSON</h2>
                <div class="form-section"><label>1. LESSON NAME</label><input type="text" id="new-lesson-name"></div>
                <div class="form-section"><label>2. NUMBER OF TEAMS</label><select id="teamCount"><option value="2">2 Teams</option><option value="3" selected>3 Teams</option><option value="4">4 Teams</option><option value="5">5 Teams</option></select></div>
                <div id="word-entry-list"></div>
                <button class="btn-action" style="background:var(--primary); color:#000; margin-bottom:15px; width:100%; max-width:450px;" onclick="addNewWordRow()">+ ADD WORD</button>
                <button class="btn-action" style="background:#2ecc71; color:white; width:100%; max-width:450px;" onclick="finalizeAndSave()">SAVE LESSON PLAN</button>
            </div>

            <div id="load-step" class="step-container">
                <button class="btn-action" onclick="goToStep('hub-view')" style="background:none; color:white; margin-bottom:10px;">← BACK TO HUB</button>
                <h2 style="margin-bottom:30px;">LOAD LESSON</h2>
                <div id="saved-lessons-container" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
                <button class="btn-action" style="background:var(--danger); color:white; margin-top:50px; font-size:0.7rem; width:200px;" onclick="clearAllLessons()">WIPE ALL DATA</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="game-header">
            <div id="puzzle-counter">PUZZLE 1 / 10</div>
            <div id="lesson-title-display">LESSON NAME</div>
        </div>
        <div class="top-controls">
            <button class="btn-control" onclick="showScreen('teacher-screen')">⚙️</button>
            <button class="music-btn-node btn-control" onclick="toggleMusic()">🔇</button>
            <button class="btn-control" onclick="toggleFullScreen()">⛶</button>
        </div>
        <div id="scoreboard"></div>
        <div id="board-container" style="position:relative; width: fit-content; margin: 0 auto;">
            <div id="board" style="display:grid; gap:8px; justify-content:center;"></div>
            <button id="row-check-btn" class="btn-action" style="display:none; position:absolute; right:-120px; width:100px; background:var(--danger); color:white;" onclick="checkRow()">CHECK</button>
            <button id="next-word-btn" class="btn-action" style="display:none; position:absolute; right: -180px; width: 160px; background: var(--correct); color: white;"></button>
        </div>
        <div style="margin: 30px 0; display:flex; gap:20px; justify-content:center;">
            <button class="btn-action" style="width:180px; background:#ff9f43; color:white;" onclick="flashHint('img')">IMAGE (-5 PTS)</button>
            <button class="btn-action" style="width:180px; background:#54a0ff; color:white;" onclick="flashHint('def')">TEXT (-2 PTS)</button>
            <button class="btn-action" style="width:180px; background:var(--solve); color:white;" onclick="solvePuzzle()">SOLVE PUZZLE</button>
        </div>
        <div id="keyboard" style="width:90%; max-width:900px; margin-bottom:30px;"><div class="kb-row" id="single-row-abc" style="display:flex; gap:5px; justify-content:center;"></div></div>
    </div>

    <div id="ranking-screen" class="screen">
        <h1 style="font-size:3rem; color:var(--gold); margin-bottom:10px;">FINAL RANKING</h1>
        <div id="rank-list" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-bottom:40px;"></div>
        <button class="btn-action" style="background:white; color:black; width:250px;" onclick="closeLesson()">CLOSE</button>
    </div>

    <div id="hint-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:40px; border-radius:20px; text-align:center; z-index:3000; width:500px; box-shadow:0 0 100px rgba(0,0,0,0.8);">
        <div id="timer-display" style="position:absolute; top:-25px; right:-25px; background:red; color:white; width:60px; height:60px; border-radius:50%; line-height:60px; font-weight:bold; font-size:1.5rem; border:4px solid white;">5</div>
        <div id="modal-content" style="color:#000;"></div>
    </div>

    <script>
        let playlist = []; let currentIndex = 0; let secretWord = ""; let currentRow = 0, currentCol = 0;
        let isMusicPlaying = false; let currentLessonName = ""; let activeTeamIdx = 0; let isGameOver = false; let currentPage = 1;

        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function goToStep(stepId) { document.querySelectorAll('.step-container').forEach(s => s.classList.remove('active')); document.getElementById(stepId).classList.add('active'); }
        function openTeacherHub() { goToStep('hub-view'); showScreen('teacher-screen'); }
        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 600; const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        function exportAllLessons() {
            const data = localStorage.getItem('esl_clean_v1'); if(!data) return alert("Nothing to export.");
            const blob = new Blob([data], {type: 'application/json'}); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'wordle_lessons_backup.json'; a.click();
        }

        function importLessons(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try { JSON.parse(e.target.result); localStorage.setItem('esl_clean_v1', e.target.result); alert("Import Successful!"); openLoadStep(); } 
                catch(err) { alert("Invalid File Format."); }
            };
            reader.readAsText(file);
        }

        function startFreshCreate() {
            document.getElementById('create-title').innerText = "NEW LESSON";
            document.getElementById('new-lesson-name').value = ""; document.getElementById('new-lesson-name').disabled = false;
            document.getElementById('word-entry-list').innerHTML = ""; addNewWordRow(); goToStep('create-step');
        }

        function addNewWordRow(w="", d="", img="") {
            const div = document.createElement('div'); div.className = 'word-card';
            div.innerHTML = `
                <label>WORD (${w.length} Letters)</label>
                <input type="text" value="${w}" class="p-word" placeholder="e.g. APPLE" oninput="this.previousElementSibling.innerText='WORD ('+this.value.length+' Letters)'">
                <label>TEXT HINT</label><textarea class="p-def" rows="1">${d}</textarea>
                <label>IMAGE HINT</label><input type="file" class="p-img" accept="image/*">
                ${img ? '<div style="margin-top:5px;"><small style="color:var(--primary)">✓ Existing Image Saved</small></div>' : ''}
                <button class="btn-action" style="background:var(--danger); color:white; padding:5px; margin-top:10px; font-size:0.7rem; width:auto;" onclick="this.parentElement.remove()">DELETE WORD</button>
            `;
            if(img) div.dataset.existingImg = img;
            document.getElementById('word-entry-list').appendChild(div);
        }

        async function finalizeAndSave() {
            const name = document.getElementById('new-lesson-name').value.trim(); if(!name) return alert("Missing Lesson Name!");
            const cards = document.querySelectorAll('.word-card'); let words = [];
            for(let card of cards) {
                const w = card.querySelector('.p-word').value.toUpperCase().trim();
                const d = card.querySelector('.p-def').value;
                const fileInput = card.querySelector('.p-img'); const file = fileInput.files[0];
                let img = card.dataset.existingImg || ""; if(file) img = await compressImage(file);
                if(w) words.push({w, d, img});
            }
            let saves = JSON.parse(localStorage.getItem('esl_clean_v1') || '{}');
            saves[name] = { words, teams: document.getElementById('teamCount').value };
            localStorage.setItem('esl_clean_v1', JSON.stringify(saves)); alert("Saved Successfully!"); openLoadStep();
        }

        function openLoadStep() {
            const container = document.getElementById('saved-lessons-container');
            const saves = JSON.parse(localStorage.getItem('esl_clean_v1') || '{}');
            container.innerHTML = '';
            Object.keys(saves).forEach(name => {
                const row = document.createElement('div'); row.className = "load-row";
                row.innerHTML = `<button class="btn-play-lesson" onclick="launchLesson('${name}')">▶ PLAY: ${name}</button><button class="btn-edit-lesson" onclick="editLesson('${name}')">EDIT</button><button class="btn-del-lesson" onclick="deleteLesson('${name}')">DEL</button>`;
                container.appendChild(row);
            });
            goToStep('load-step');
        }

        function editLesson(name) {
            const saves = JSON.parse(localStorage.getItem('esl_clean_v1') || '{}');
            const lesson = saves[name]; if (!lesson) return;
            document.getElementById('create-title').innerText = "EDIT LESSON: " + name;
            document.getElementById('new-lesson-name').value = name; document.getElementById('new-lesson-name').disabled = true;
            document.getElementById('teamCount').value = lesson.teams || 3;
            document.getElementById('word-entry-list').innerHTML = "";
            lesson.words.forEach(item => addNewWordRow(item.w, item.d, item.img)); goToStep('create-step');
        }

        function deleteLesson(name) {
            if (confirm(`Are you sure?`)) {
                let saves = JSON.parse(localStorage.getItem('esl_clean_v1') || '{}');
                delete saves[name]; localStorage.removeItem(`state_${name}`);
                localStorage.setItem('esl_clean_v1', JSON.stringify(saves)); openLoadStep();
            }
        }

        function launchLesson(name) {
            const saves = JSON.parse(localStorage.getItem('esl_clean_v1') || '{}');
            currentLessonName = name; setupGame(saves[name].words, saves[name].teams);
        }

        function setupGame(wordList, tCount) {
            playlist = wordList.map(item => ({word: item.w, def: item.d, img: item.img}));
            const savedState = JSON.parse(localStorage.getItem(`state_${currentLessonName}`) || 'null');
            currentIndex = savedState ? savedState.currentIndex : 0;
            const savedScores = savedState ? savedState.scores : Array(parseInt(tCount)).fill(0);
            document.getElementById('lesson-title-display').innerText = currentLessonName;
            const sb = document.getElementById('scoreboard'); sb.innerHTML = '';
            for(let i=0; i<tCount; i++) {
                sb.innerHTML += `<div class="team-box ${i==activeTeamIdx?'active-team':''}" id="team-box-${i}" onclick="setActiveTeam(${i})">TEAM ${i+1}<span id="score-${i}" class="score-val">${savedScores[i] || 0}</span><div class="score-controls" onclick="event.stopPropagation()"><button onclick="updateScore(${i},1)">+</button><button onclick="updateScore(${i},-1)">-</button></div></div>`;
            }
            loadGame(); showScreen('game-screen');
        }

        function setActiveTeam(idx) { activeTeamIdx = idx; document.querySelectorAll('.team-box').forEach(b => b.classList.remove('active-team')); document.getElementById(`team-box-${idx}`).classList.add('active-team'); }

        function loadGame() {
            isGameOver = false; currentPage = 1; const current = playlist[currentIndex];
            secretWord = current.word; currentRow = 0; currentCol = 0;
            document.getElementById('puzzle-counter').innerText = `PUZZLE ${currentIndex + 1} / ${playlist.length}`;
            document.getElementById('next-word-btn').style.display = 'none';
            document.getElementById('row-check-btn').style.display = 'none';
            const board = document.getElementById('board'); board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${secretWord.length}, 1fr)`;
            for (let i = 0; i < 7 * secretWord.length; i++) {
                const tile = document.createElement('div'); tile.className = 'tile'; tile.id = `tile-${i}`; board.appendChild(tile);
            }
            createKeyboard();
        }

        function createKeyboard() {
            const row = document.getElementById('single-row-abc'); row.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(char => {
                const btn = document.createElement('button'); btn.textContent = char; btn.className = 'key'; btn.id = `key-${char}`;
                btn.onclick = () => handleInput(char); row.appendChild(btn);
            });
            const del = document.createElement('button'); del.textContent = "DEL"; del.className = "key"; del.style.background="var(--danger)"; del.style.color="white";
            del.onclick = () => handleInput("DEL"); row.appendChild(del);
        }

        function handleInput(key) {
            if (isGameOver) return;
            const rowCheck = document.getElementById('row-check-btn');
            if (key === "DEL" || key === "Backspace") {
                if (currentCol > 0) { currentCol--; document.getElementById(`tile-${currentRow * secretWord.length + currentCol}`).textContent = ""; rowCheck.style.display = "none"; }
            } else if (currentCol < secretWord.length && key.length === 1 && /[A-Z]/i.test(key)) {
                const tile = document.getElementById(`tile-${currentRow * secretWord.length + currentCol}`);
                tile.textContent = key.toUpperCase(); tile.classList.add('pop'); setTimeout(()=>tile.classList.remove('pop'), 100);
                currentCol++;
                if (currentCol === secretWord.length) { rowCheck.style.display = "block"; rowCheck.style.top = `${tile.offsetTop}px`; }
            }
        }

        function checkRow() {
            const startIdx = currentRow * secretWord.length; let guess = [];
            for (let i = 0; i < secretWord.length; i++) guess.push(document.getElementById(`tile-${startIdx + i}`).textContent);
            let solutionArray = secretWord.split(""); let result = Array(secretWord.length).fill("absent");
            for (let i = 0; i < secretWord.length; i++) { if (guess[i] === solutionArray[i]) { result[i] = "correct"; solutionArray[i] = null; } }
            for (let i = 0; i < secretWord.length; i++) { if (result[i] !== "correct" && solutionArray.includes(guess[i])) { result[i] = "present"; solutionArray[solutionArray.indexOf(guess[i])] = null; } }
            for (let i = 0; i < secretWord.length; i++) {
                const tile = document.getElementById(`tile-${startIdx + i}`);
                setTimeout(() => { tile.classList.add('flip-reveal'); setTimeout(() => { tile.classList.remove('flip-reveal'); tile.classList.add(result[i]); }, 300); }, i * 150);
            }
            document.getElementById('row-check-btn').style.display = "none";
            if (guess.join("") === secretWord) { isGameOver = true; setTimeout(() => { confetti({ particleCount: 150, spread: 70 }); showEndControls(); }, (secretWord.length * 150) + 400); }
            else if (currentRow === 6) { if (currentPage === 1) setTimeout(() => { startPageTwo(guess, result); }, 1500); else { isGameOver = true; setTimeout(solvePuzzle, 1000); } }
            else { currentRow++; currentCol = 0; }
        }

        function startPageTwo(lastGuess, lastResult) {
            currentPage = 2; currentRow = 1; currentCol = 0;
            const board = document.getElementById('board'); board.innerHTML = ''; 
            for (let i = 0; i < 7 * secretWord.length; i++) {
                const tile = document.createElement('div'); tile.className = 'tile'; tile.id = `tile-${i}`;
                if (i < secretWord.length) { tile.textContent = lastGuess[i]; tile.classList.add(lastResult[i]); }
                board.appendChild(tile);
            }
        }

        function solvePuzzle() {
            isGameOver = true;
            for (let i = 0; i < secretWord.length; i++) {
                const tile = document.getElementById(`tile-${currentRow * secretWord.length + i}`);
                if(tile) { tile.textContent = secretWord[i]; tile.classList.add('correct'); }
            }
            showEndControls();
        }

        function showEndControls() {
            const btn = document.getElementById('next-word-btn'); const rowStartTile = document.getElementById(`tile-${currentRow * secretWord.length}`);
            if (currentIndex < playlist.length - 1) { btn.innerText = "NEXT WORD 🎉"; btn.onclick = () => { currentIndex++; saveCurrentState(); loadGame(); }; } 
            else { btn.innerText = "VIEW RANKING 🏆"; btn.onclick = showRanking; }
            btn.style.display = 'block'; btn.style.top = `${rowStartTile.offsetTop}px`;
        }

        function flashHint(type) {
            const item = playlist[currentIndex]; if (type === 'img' && !item.img) return alert("No image!");
            updateScore(activeTeamIdx, type === 'img' ? -5 : -2);
            const modal = document.getElementById('hint-modal'); const content = document.getElementById('modal-content');
            if (type === 'img') content.innerHTML = `<img src="${item.img}" style="max-width:100%; max-height:60vh;">`;
            else content.innerHTML = `<h2>${item.def || 'No hint.'}</h2>`;
            modal.style.display = 'block';
            let time = 5; document.getElementById('timer-display').innerText = time;
            const t = setInterval(() => { time--; document.getElementById('timer-display').innerText = time; if(time <= 0) { clearInterval(t); modal.style.display='none'; } }, 1000);
        }

        function updateScore(idx, v) { const s = document.getElementById(`score-${idx}`); s.innerText = parseInt(s.innerText) + v; saveCurrentState(); }
        function saveCurrentState() {
            const scores = Array.from(document.querySelectorAll('.score-val')).map(s => parseInt(s.innerText));
            localStorage.setItem(`state_${currentLessonName}`, JSON.stringify({ currentIndex, scores }));
        }
        function showRanking() {
            const scores = Array.from(document.querySelectorAll('.team-box')).map((box, i) => ({ name: `TEAM ${i+1}`, score: parseInt(box.querySelector('.score-val').innerText) }));
            scores.sort((a, b) => b.score - a.score);
            const list = document.getElementById('rank-list'); list.innerHTML = '';
            scores.forEach((s, i) => {
                const div = document.createElement('div'); div.className = `rank-card ${i === 0 ? 'rank-1' : ''}`;
                div.innerHTML = `<span>#${i+1} ${s.name}</span> <span>${s.score} PTS</span>`;
                list.appendChild(div);
            });
            showScreen('ranking-screen');
        }
        function toggleMusic() { 
            const a = document.getElementById('bgMusic'); 
            if(isMusicPlaying) a.pause(); else a.play().catch(()=>{}); 
            isMusicPlaying = !isMusicPlaying; 
            document.querySelectorAll('.music-btn-node').forEach(btn => btn.innerText = isMusicPlaying ? "🔊" : "🔇"); 
        }
        function startQuickGame() { openLoadStep(); }
        function closeLesson() { localStorage.removeItem(`state_${currentLessonName}`); showScreen('welcome-screen'); }
        function clearAllLessons() { if(confirm("Wipe everything?")) { localStorage.clear(); openLoadStep(); } }
        window.addEventListener('keydown', e => { if (isGameOver) return; if(e.key === "Enter" && currentCol === secretWord.length) checkRow(); else handleInput(e.key); });
    </script>
</body>
</html>
